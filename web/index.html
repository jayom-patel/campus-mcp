<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CampusMCP - VIT Pune CSE (AI &amp; ML)</title>
<style>
  :root {
    --text: #2C2C2B;
    --muted: #7D7A75;
    --canvas: #FFFFFF;
    --soft: #F9F8F7;
    --surface: #F0EFED;
    --border: #E6E5E3;
    --accent: #2783DE;
    --accent-soft: #E5F2FC;
    --danger: #E56458;
    --danger-soft: #FCE9E7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #FFFFFF;
      --muted: rgba(255,255,255,0.65);
      --canvas: #191919;
      --soft: #202020;
      --surface: #383836;
      --border: rgba(255,255,255,0.20);
      --accent: #5E9FE8;
      --accent-soft: rgba(94,159,232,0.12);
      --danger: #E97366;
      --danger-soft: rgba(233,115,102,0.12);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .mark {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 14px;
    flex: none;
  }
  .titles { flex: 1 1 auto; min-width: 0; }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { margin: 0; font-size: 14px; color: var(--muted); }

  main {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 24px;
  }
  .inner { max-width: 720px; margin: 0 auto; }

  .intro { padding: 8px 0 24px; }
  .intro h2 {
    margin: 0 0 8px;
    font-size: 26px; font-weight: 600; letter-spacing: -0.02em;
  }
  .intro p { margin: 0; color: var(--muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--soft);
    color: var(--text);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    cursor: pointer;
    min-height: 44px;
    text-align: left;
  }
  .chip:hover { background: var(--surface); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .msg { margin-bottom: 24px; }
  .role {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted); margin-bottom: 8px;
  }
  .bubble {
    border-radius: 8px;
    padding: 12px 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .user .bubble { background: var(--accent-soft); border: 1px solid var(--border); }
  .bot .bubble { background: var(--soft); border: 1px solid var(--border); }
  .err .bubble {
    background: var(--danger-soft);
    border: 1px solid var(--danger);
  }
  .tools {
    margin-top: 8px; font-size: 13px; color: var(--muted);
    font-family: Menlo, Consolas, monospace;
  }

  .dots span {
    display: inline-block; width: 6px; height: 6px; margin-right: 4px;
    border-radius: 50%; background: var(--muted);
    animation: pulse 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes pulse { 0%,100% { opacity:.25 } 50% { opacity:1 } }
  @media (prefers-reduced-motion: reduce) {
    .dots span { animation: none; opacity: .6; }
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    background: var(--canvas);
  }
  form { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  input[type=text] {
    flex: 1 1 auto; min-width: 0;
    font: inherit; color: var(--text);
    background: var(--soft);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    min-height: 44px;
  }
  input[type=text]:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  button[type=submit] {
    font: inherit; font-weight: 600;
    background: var(--accent); color: #fff;
    border: 0; border-radius: 8px;
    padding: 12px 24px;
    min-height: 44px; min-width: 88px;
    cursor: pointer;
  }
  button[type=submit]:disabled { opacity: .5; cursor: default; }
  .note {
    max-width: 720px; margin: 8px auto 0;
    font-size: 13px; color: var(--muted);
  }

  @media (max-width: 480px) {
    header, main, footer { padding-left: 16px; padding-right: 16px; }
    .intro h2 { font-size: 22px; }
  }
</style>
</head>
<body>

<header>
  <div class="mark" aria-hidden="true">C</div>
  <div class="titles">
    <h1>CampusMCP</h1>
    <p class="sub">Timetable, deadlines and syllabus for SY CSE (AI &amp; ML), VIT Pune</p>
  </div>
</header>

<main id="main">
  <div class="inner">
    <div class="intro" id="intro">
      <h2>Ask about your classes.</h2>
      <p>Answers come from this class's real timetable and academic calendar, not guesswork.</p>
      <div class="chips" id="chips">
        <button class="chip" type="button">What's my next class?</button>
        <button class="chip" type="button">Timetable for tomorrow</button>
        <button class="chip" type="button">What's due in the next 10 days?</button>
        <button class="chip" type="button">Which unit covers backpropagation?</button>
      </div>
    </div>
    <div id="thread" aria-live="polite"></div>
  </div>
</main>

<footer>
  <form id="form" autocomplete="off">
    <label for="q" class="sr" hidden>Your question</label>
    <input id="q" type="text" placeholder="e.g. kal ka timetable batao" required />
    <button type="submit" id="send">Send</button>
  </form>
  <p class="note">Built by Jayom Patel with Claude + MCP. Verify exam dates with your CR before relying on them.</p>
</footer>

<script>
(function () {
  var thread = document.getElementById("thread");
  var intro = document.getElementById("intro");
  var form = document.getElementById("form");
  var input = document.getElementById("q");
  var send = document.getElementById("send");
  var main = document.getElementById("main");
  var history = [];

  var visitor = localStorage.getItem("campusmcp_visitor");
  if (!visitor) {
    visitor = "v" + Math.random().toString(36).slice(2, 10);
    localStorage.setItem("campusmcp_visitor", visitor);
  }

  function add(role, text, cssClass, tools) {
    var wrap = document.createElement("div");
    wrap.className = "msg " + (cssClass || role);
    var label = document.createElement("div");
    label.className = "role";
    label.textContent = role === "user" ? "You" : "CampusMCP";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    if (text instanceof Node) { bubble.appendChild(text); }
    else { bubble.textContent = text; }
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    if (tools && tools.length) {
      var t = document.createElement("div");
      t.className = "tools";
      t.textContent = "tools: " + tools.join(", ");
      wrap.appendChild(t);
    }
    thread.appendChild(wrap);
    main.scrollTop = main.scrollHeight;
    return wrap;
  }

  function dots() {
    var d = document.createElement("span");
    d.className = "dots";
    d.innerHTML = "<span></span><span></span><span></span>";
    return d;
  }

  function ask(question) {
    if (!question) return;
    intro.style.display = "none";
    add("user", question);
    history.push({ role: "user", content: question });
    input.value = "";
    send.disabled = true;

    var pending = add("assistant", dots());

    fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: history, visitor: visitor })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
      .then(function (res) {
        thread.removeChild(pending);
        if (!res.ok || res.body.error) {
          add("assistant", res.body.error || "Something went wrong.", "err");
          history.pop();
          return;
        }
        add("assistant", res.body.reply, "bot", res.body.tools_used);
        history.push({ role: "assistant", content: res.body.reply });
      })
      .catch(function (e) {
        thread.removeChild(pending);
        add("assistant", "Network error: " + e.message, "err");
        history.pop();
      })
      .then(function () {
        send.disabled = false;
        input.focus();
      });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    ask(input.value.trim());
  });

  document.getElementById("chips").addEventListener("click", function (e) {
    if (e.target.classList.contains("chip")) ask(e.target.textContent);
  });
})();
</script>
</body>
</html>
